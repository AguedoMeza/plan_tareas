<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-group">
            <select id="boardSelector" class="toolbar-select" onchange="BoardController.handleBoardChange(this.value)">
                <!-- Las opciones se llenarán dinámicamente -->
            </select>
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn" onclick="BoardController.showCreateBoardModal()" title="Nuevo tablero">
                <i class="bi bi-plus"></i>
            </button>
            <button type="button" class="toolbar-btn" onclick="BoardController.showRenameBoardModal()" title="Renombrar tablero">
                <i class="bi bi-pencil"></i>
            </button>
            <button type="button" class="toolbar-btn toolbar-btn-danger" onclick="BoardController.confirmDeleteBoard()" title="Eliminar tablero">
                <i class="bi bi-trash3"></i>
            </button>
        </div>

        <div class="toolbar-group">
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn vista-toggle active" data-vista="completa" onclick="cambiarVista('completa')" title="Vista completa">
                <i class="bi bi-list-task"></i>
            </button>
            <button type="button" class="toolbar-btn vista-toggle" data-vista="viva" onclick="cambiarVista('viva')" title="Vista viva">
                <i class="bi bi-bullseye"></i><span class="toolbar-badge" id="contadorVivos">0</span>
            </button>
        </div>

        <div class="toolbar-group">
            <div class="toolbar-divider"></div>
            <button type="button" class="toolbar-btn toolbar-btn-accent" onclick="openCreateModal()" title="Crear nuevo">
                <i class="bi bi-plus-lg"></i><span class="toolbar-label">Nuevo</span>
            </button>
            <button type="button" class="toolbar-btn" onclick="StorageController.exportStorage()" title="Exportar tablero">
                <i class="bi bi-download"></i>
            </button>
            <label class="toolbar-btn" title="Importar tablero" style="cursor:pointer; margin:0;">
                <i class="bi bi-upload"></i>
                <input type="file" id="importStorageInput" accept="application/json" style="display:none;" onchange="StorageController.importStorage(event)">
            </label>
        </div>
    </div>

    <!-- Incluir Modal de Creación -->
    <div id="modalContainer"></div>

    <!-- VISTA COMPLETA -->
    <div id="vistaCompletaContainer">
        <div class="panel" id="boardPanel">
            <div class="panelHeader">
                <h2><i class="bi bi-kanban"></i> Board <span class="panelBadge" id="badgeProyectos">Proyectos</span></h2>
            </div>

            <!-- Sección Activos -->
            <div class="board-section" id="sectionActivos" style="display:none;">
                <div class="sectionTitle sectionTitle--ok">
                    <div class="sectionTitle-left">
                        <span class="sectionDot sectionDot--ok"></span>
                        <span>Activos</span>
                        <span class="sectionCount" id="countActivos">0</span>
                    </div>
                </div>
                <div class="projList" id="projListActivos"></div>
            </div>

            <!-- Sección Backlog -->
            <div class="board-section" id="sectionBacklog" style="display:none;">
                <div class="sectionTitle sectionTitle--warn">
                    <div class="sectionTitle-left">
                        <span class="sectionDot sectionDot--warn"></span>
                        <span>Backlog</span>
                        <span class="sectionCount" id="countBacklog">0</span>
                    </div>
                </div>
                <div class="projList" id="projListBacklog"></div>
            </div>

            <!-- Sección Archivados -->
            <div class="board-section" id="sectionArchivados" style="display:none;">
                <div class="sectionTitle sectionTitle--muted">
                    <div class="sectionTitle-left">
                        <span class="sectionDot sectionDot--muted"></span>
                        <span>Archivados</span>
                        <span class="sectionCount" id="countArchivados">0</span>
                    </div>
                </div>
                <div class="projList" id="projListArchivados"></div>
            </div>

            <!-- Estado vacío -->
            <div id="emptyStateActive" style="display: none; text-align: center; padding: 40px; color: var(--text-muted);">
                <div style="font-size: 48px; margin-bottom: 16px;"><i class="bi bi-bullseye"></i></div>
                <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">No hay proyectos</div>
                <div style="font-size: 14px;">Crea un nuevo proyecto para empezar</div>
            </div>
        </div>
    </div>

    <!-- VISTA VIVA -->
    <div id="vistaVivaContainer" style="display: none;">
        <div class="container">
            <table id="projectTable">
                <thead>
                    <tr>
                        <th>Ruta</th>
                        <th>Nombre</th>
                        <th>Descripción breve</th>
                        <th>Prioridad</th>
                        <th>Avance</th>
                        <th>Esfuerzo (días/semanas)</th>
                        <th>DeadLine</th>
                        <th>Estado</th>
                        <th style="width: 60px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SortableJS para Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <!-- Cargar los datos de proyectos y reglas de negocio desde archivo externo -->
    <script src="proyectosData.js"></script>
    <script src="reglasNegocio.js"></script>
    <script src="storageController.js"></script>
    <script src="boardController.js"></script>
    <script src="formController.js"></script>
    <script src="vistaVivaController.js"></script>
    
    <!-- Controladores refactorizados -->
    <script src="dataController.js"></script>
    <script src="renderController.js"></script>
    <script src="dragDropController.js"></script>
    <script src="projectController.js"></script>
    
    <!-- Punto de entrada de la aplicación (debe ser el último) -->
    <script src="app.js"></script>
</body>
</html>
